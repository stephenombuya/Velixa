server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs
        git:
          # Uncomment for Git-backed config
          # uri: https://github.com/your-org/velixa-config
          # default-label: main
          # clone-on-start: true
  profiles:
    active: native
  security:
    user:
      name: config
      password: config_secret

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eureka_secret@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
